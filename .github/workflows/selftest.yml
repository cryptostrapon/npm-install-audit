name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke-test the composite action against the harmless demo
        id: demo
        uses: ./
        with:
          path: examples/safe-take-home
          fail-on-findings: 'false'
      - name: Check the action findings output
        shell: bash
        env:
          FINDINGS: ${{ steps.demo.outputs.findings }}
        run: test "$FINDINGS" = "2"
